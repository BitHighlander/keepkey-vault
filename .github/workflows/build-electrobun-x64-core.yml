name: Build Electrobun macOS Intel Core

on:
  workflow_dispatch:
  push:
    branches: ['codex/develop-cleanup-public']
    paths:
      - '.github/workflows/build-electrobun-x64-core.yml'
      - 'scripts/build-electrobun-x64-core.sh'
      - 'modules/electrobun'

permissions:
  contents: read

jobs:
  build:
    name: Native Intel core (macOS 13 floor)
    runs-on: macos-15-intel
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - name: Initialize pinned Electrobun source only
        run: git submodule update --init modules/electrobun

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Vendor Electrobun build dependencies
        working-directory: modules/electrobun/package
        run: |
          bun install --frozen-lockfile
          bun build.ts

      - name: Build macOS 13 Intel core
        run: make build-electrobun-x64-core

      - name: Record archive hash and contents
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE=artifacts/electrobun-core-darwin-x64.tar.gz
          test -f "$ARCHIVE"
          shasum -a 256 "$ARCHIVE" | tee artifacts/electrobun-core-darwin-x64.sha256
          tar tzf "$ARCHIVE"

      - uses: actions/upload-artifact@v4
        with:
          name: electrobun-core-darwin-x64-${{ github.sha }}
          path: |
            artifacts/electrobun-core-darwin-x64.tar.gz
            artifacts/electrobun-core-darwin-x64.sha256
          if-no-files-found: error
          retention-days: 30
